[project]
name = "handover-agent"
version = "0.1.0"
description = "Handover 인수인계 업무 도우미 에이전트 (D1: 색인·벡터 검색 기준선)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "numpy>=2.0",
  "voyageai>=0.3",
  "langgraph>=1.2.12",
  "anthropic>=1.9.0",
  "tzdata>=2026.4",
  "mcp>=1.0",
]

[project.optional-dependencies]
# EMBEDDING_PROVIDER=local 일 때만 (CPU torch는 `uv sync --extra local --index pytorch-cpu`처럼 별도 지정)
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.uv]
package = false # 라이브러리로 설치하지 않고 agent/ 를 그대로 import 경로로 사용

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # 한글 문자열·표 행은 포매터 줄 길이에 맡긴다

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
